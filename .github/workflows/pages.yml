name: Test, sync and publish SuperScan

on:
  push:
    branches: [main]
  schedule:
    - cron: "18 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh source prices and offers
        env:
          PRIJSPROFEET_API_KEY: ${{ secrets.PRIJSPROFEET_API_KEY }}
        run: python scripts/sync_sources.py
      - name: Assemble Pages artifact
        run: |
          mkdir -p dist
          cp index.html styles.css manifest.webmanifest favicon.svg sw.js dist/
          cp -r src data dist/
          test -s dist/data/deals.json
          test -s dist/data/prices.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
